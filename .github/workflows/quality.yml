name: Quality
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "比较基准提交的完整 SHA（40 位小写十六进制字符）"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: pyproject.toml
          python-version-file: ".python-version"
      - run: python scripts/check_quality.py --check dependency-sync
  checks:
    needs: dependency-sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, type-check, traceability, unit-test, contract-test, integration-test, e2e-test, coverage, security-scan, evaluation-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: pyproject.toml
          python-version-file: ".python-version"
      - run: uv sync --frozen --all-groups
      - name: Run gate
        env:
          CHECK: ${{ matrix.check }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          if [ "$CHECK" = coverage ]; then
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "比较基准 SHA 格式无效。" >&2
              exit 1
            fi
            git cat-file -e "$BASE_SHA^{commit}"
            BASELINE=$(git merge-base "$BASE_SHA" HEAD)
            uv run --frozen python scripts/check_quality.py --check "$CHECK" --base-sha "$BASELINE"
          else
            uv run --frozen python scripts/check_quality.py --check "$CHECK"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.check }}
          path: |
            .review/quality/*.json
            .review/*-results.xml
            coverage.xml
