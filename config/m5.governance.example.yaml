# 配置 M5 项目治理、记忆生命周期及专项审查者。
# 项目注册与关联完成前，保持 governance.enabled 为 false。
schema_version: 1
project_id: example-project

database:
  path: .review/m5-governance-example.db

llm:
  provider: dataset
  dataset_path: datasets/development/review_cases.json

review:
  mode: rules
  context_tools_enabled: true
  reflection_enabled: true
  max_workers: 2

memory:
  # 显式指定有权执行治理 CLI 的内部人员 ID。
  maintainers:
    - tanaka
  is_production: false

security:
  allow_external_source: false

scm:
  enabled: false
  provider: github
  # 使用与 bind-repository 的 --external-repository 相同的值。
  repository_external_id: owner/repository
  publish_enabled: false

governance:
  # 完成 project register、bind-repository 及必要的 adopt-existing 后设为 true。
  enabled: false
  memory_lifecycle_enabled: false
  # 仅为高风险变更新增最多一位辅助审查者。使用真实 LLM 时会增加用量。
  specialized_reviewers_enabled: false
  # 防止重复执行同一审查及旧所有者写入。启用 M5 后按需显式开启。
  execution_leases_enabled: false
  max_reviewer_profiles: 2
  additional_reviewer_risk_threshold: high
  specialist_total_tokens: 6000
  specialist_max_output_tokens: 3000
  revalidation_default_days: 180
  # 租约有效期以秒计，用于限制检测心跳中断的等待时间。
  lease_seconds: 180
  # 使用独立连接延长租约的间隔，须小于 lease_seconds。
  heartbeat_seconds: 30
  # 各 SQLite 连接等待解锁的最长时间，以毫秒计。
  sqlite_busy_timeout_ms: 5000

# 默认关闭外发。使用 OpenTelemetry 时，先同步 telemetry 可选依赖，
# 设置 enabled: true、provider: opentelemetry，以及完全匹配的 HTTPS endpoint 和 allowed_hosts。
# 认证请求头仅通过 REVIEW_OTEL_EXPORTER_HEADERS 环境变量传入。
telemetry:
  enabled: false
  provider: noop
  endpoint: null
  allowed_hosts: []
  service_name: self-improving-code-review
  sample_ratio: 0.0
  export_timeout_seconds: 5
  max_queue_size: 2048
