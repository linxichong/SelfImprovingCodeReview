# 在本地验证 M3 的补充代码读取、自我验证与并行处理。
# 仅使用 dataset 提供方，无需网络或 API 密钥。
schema_version: 1
project_id: self-improving-code-review-m3-example

database:
  path: .review/m3-example.db

llm:
  provider: dataset
  dataset_path: datasets/development/m3_review_cases.example.json

review:
  mode: rules
  # 在仓库内按限定范围读取补充代码。
  context_tools_enabled: true
  # 通过确定性验证后，在单独一轮自我验证中检查候选。
  reflection_enabled: true
  # 最多并行执行两个独立审查单元。
  max_workers: 2
  # 下面是单文件大小、搜索结果数、Token 与调用次数的安全上限。
  max_context_file_bytes: 1048576
  max_tool_results: 20
  dynamic_context_tokens: 6000
  reflection_tokens: 2000
  max_tool_calls: 5

security:
  allow_external_source: false
