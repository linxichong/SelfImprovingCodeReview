[project]
name = "self-improving-code-review"
version = "0.1.2"
description = "Self-improving AI code reviewer with engineering memory"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "detect-secrets==1.5.0",
    "litellm>=1.81,<2",
    "pydantic>=2.7",
    "packaging>=24",
    "pyyaml>=6.0",
]

[project.scripts]
review = "self_improving_code_review.cli.main:main"

[dependency-groups]
dev = [
    "bandit>=1.7",
    "diff-cover>=9.0",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pre-commit==4.6.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
telemetry = [
    "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
    "opentelemetry-sdk>=1.31,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_improving_code_review"]

[tool.uv]
required-version = "==0.11.11"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
allowed-confusables = ["，"]
select = [
  "E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4",
  "DTZ", "T10", "T20", "PIE", "PT", "RET", "RUF", "SIM",
  "ARG", "PTH", "TRY", "PERF"
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "D"]
"src/self_improving_code_review/**/__init__.py" = ["D104"]
"src/self_improving_code_review/cli/output.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["src/self_improving_code_review"]
exclude = "^tests/"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["detect_secrets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "case(*ids): design case identifiers linked to this test (not an acceptance verdict)",
    "smoke: minimal evaluation case executed in the PR-required evaluation-smoke job",
]

[tool.coverage.run]
source = ["self_improving_code_review"]
